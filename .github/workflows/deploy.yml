name: Compilar y publicar produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produccion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar
        env:
          # Si el sitio usa variables VITE_, agregalas aqui.
          # Recuerda: terminan dentro del bundle publico, no pongas secretos.
          VITE_SITE_URL: https://navsolutions.cl
        run: npm run build

      - name: Verificar el build
        run: |
          test -f dist/index.html || { echo "No se genero dist/index.html"; exit 1; }
          echo "Build correcto:"
          du -sh dist
          ls dist

      - name: Publicar en la rama production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B production
          git add -f dist
          git commit -m "build desde ${GITHUB_SHA::7}"
          git push -f origin production
          echo "Publicado. El servidor lo tomara en los proximos 2 minutos."

      - name: Configurar acceso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar en AWS Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" '
            set -e
            cd /opt/apps/navsolutions/dist
            git fetch origin production
            git reset --hard origin/production
            test -f dist/index.html
            echo "Despliegue completado correctamente"
          '